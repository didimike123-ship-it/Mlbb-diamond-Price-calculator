<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Diamond Price Calculator</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent-gold: #f59e0b;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 20px;
    }

    header h1 {
      color: var(--accent-gold);
      font-size: 1.7rem;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Rate Setting Box */
    .settings-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: end;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--accent-blue);
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.95rem;
    }

    .btn-gold {
      background: var(--accent-gold);
      color: #000;
    }

    .btn-gold:hover {
      background: #d97706;
    }

    .btn-blue {
      background: var(--accent-blue);
      color: #000;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }

    .btn-outline:hover {
      border-color: var(--text-muted);
    }

    /* Package Grid */
    .package-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .pkg-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s;
    }

    .pkg-card.active {
      border-color: var(--accent-gold);
      background: #1e293b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.15);
    }

    .pkg-info h3 {
      font-size: 1rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .pkg-info .coin-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .pkg-info .mmk-price {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--accent-blue);
      margin-top: 4px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: #0f172a;
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
    }

    .qty-btn:hover {
      border-color: var(--accent-blue);
    }

    .qty-val {
      min-width: 20px;
      text-align: center;
      font-weight: bold;
    }

    /* Summary Box */
    .summary-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      position: sticky;
      bottom: 12px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .summary-total {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-gold);
      border-top: 1px solid var(--card-border);
      padding-top: 10px;
      margin-top: 6px;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--success);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <header>
    <h1>💎 MLBB Diamond Calculator</h1>
    <p>Smile Coin Rate ဖြင့် မြန်မာငွေဈေးနှုန်းနှင့် ဘောက်ချာ အလိုအလျောက်တွက်ချက်စနစ်</p>
  </header>

  <!-- Rate & Profit Settings -->
  <section class="settings-panel">
    <div class="input-group">
      <label for="coinRate">1 Smile Coin ဈေးနှုန်း (MMK)</label>
      <input type="number" id="coinRate" value="68" step="0.1" oninput="renderPackages()">
    </div>
    <div class="input-group">
      <label for="profitPerPkg">Package တစ်ခုအမြတ် (MMK)</label>
      <input type="number" id="profitPerPkg" value="300" step="50" oninput="renderPackages()">
    </div>
    <button class="btn btn-gold" onclick="copyPriceList()">📋 Price List ကူးယူမည်</button>
  </section>

  <!-- Packages Grid -->
  <section class="package-grid" id="packageGrid"></section>

  <!-- Summary & Voucher Section -->
  <section class="summary-box">
    <div class="summary-row">
      <span>ရွေးချယ်ထားသော Packages:</span>
      <span id="selectedItemsText">မရှိသေးပါ</span>
    </div>
    <div class="summary-row">
      <span>စုစုပေါင်း Smile Coins:</span>
      <span id="totalCoins">0 Coins</span>
    </div>
    <div class="summary-row summary-total">
      <span>ကျသင့်ငွေ စုစုပေါင်း:</span>
      <span id="totalMMK">0 Ks</span>
    </div>
    <div class="action-buttons">
      <button class="btn btn-blue" onclick="copyVoucher()">🧾 ဘောက်ချာ Copy ကူးမည်</button>
      <button class="btn btn-outline" onclick="resetCart()">🔄 အားလုံးဖျက်မည်</button>
    </div>
  </section>

  <div class="toast" id="toastMsg">Copied to clipboard!</div>

  <script>
    // MLBB Brazil (Smile.One) Standard Packages
    const packages = [
      { id: 'wdp', name: 'Weekly Diamond Pass', coins: 76, qty: 0 },
      { id: 'd86', name: '86 Diamonds', coins: 61.5, qty: 0 },
      { id: 'd172', name: '172 Diamonds', coins: 122, qty: 0 },
      { id: 'd257', name: '257 Diamonds', coins: 177.5, qty: 0 },
      { id: 'd343', name: '343 Diamonds', coins: 239, qty: 0 },
      { id: 'd429', name: '429 Diamonds', coins: 299.5, qty: 0 },
      { id: 'd514', name: '514 Diamonds', coins: 355, qty: 0 },
      { id: 'd706', name: '706 Diamonds', coins: 480, qty: 0 },
      { id: 'd878', name: '878 Diamonds', coins: 602, qty: 0 },
      { id: 'd1049', name: '1049 Diamonds', coins: 719, qty: 0 },
      { id: 'd2195', name: '2195 Diamonds', coins: 1453, qty: 0 },
      { id: 'd3688', name: '3688 Diamonds', coins: 2424, qty: 0 },
      { id: 'd5532', name: '5532 Diamonds', coins: 3660, qty: 0 },
      { id: 'd9288', name: '9288 Diamonds', coins: 6079, qty: 0 },
      { id: 'twilight', name: 'Twilight Pass', coins: 402.5, qty: 0 }
    ];

    // Calculate MMK price rounded to nearest 50 Kyats
    function calculateMMK(coins) {
      const rate = parseFloat(document.getElementById('coinRate').value) || 0;
      const profit = parseFloat(document.getElementById('profitPerPkg').value) || 0;
      const rawPrice = (coins * rate) + profit;
      return Math.ceil(rawPrice / 50) * 50;
    }

    function renderPackages() {
      const grid = document.getElementById('packageGrid');
      grid.innerHTML = '';

      packages.forEach((pkg, index) => {
        const price = calculateMMK(pkg.coins);
        const card = document.createElement('div');
        card.className = `pkg-card ${pkg.qty > 0 ? 'active' : ''}`;
        card.innerHTML = `
          <div class="pkg-info">
            <h3>💎 ${pkg.name}</h3>
            <div class="coin-tag">${pkg.coins} Smile Coins</div>
            <div class="mmk-price">${price.toLocaleString()} Ks</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
            <span class="qty-val">${pkg.qty}</span>
            <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
          </div>
        `;
        grid.appendChild(card);
      });

      updateSummary();
    }

    function updateQty(index, change) {
      packages[index].qty = Math.max(0, packages[index].qty + change);
      renderPackages();
    }

    function updateSummary() {
      let totalCoins = 0;
      let totalMMK = 0;
      let selectedList = [];

      packages.forEach(pkg => {
        if (pkg.qty > 0) {
          const price = calculateMMK(pkg.coins);
          totalCoins += pkg.coins * pkg.qty;
          totalMMK += price * pkg.qty;
          selectedList.push(`${pkg.name} (x${pkg.qty})`);
        }
      });

      document.getElementById('selectedItemsText').innerText = selectedList.length > 0 ? selectedList.join(', ') : 'မရှိသေးပါ';
      document.getElementById('totalCoins').innerText = `${totalCoins.toFixed(1)} Coins`;
      document.getElementById('totalMMK').innerText = `${totalMMK.toLocaleString()} Ks`;
    }

    function resetCart() {
      packages.forEach(pkg => pkg.qty = 0);
      renderPackages();
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    function copyPriceList() {
      let text = "💎 MLBB Diamond Price List 💎\n━━━━━━━━━━━━━━━━━━\n";
      packages.forEach(pkg => {
        const price = calculateMMK(pkg.coins);
        text += `🔹 ${pkg.name} — ${price.toLocaleString()} Ks\n`;
      });
      text += "━━━━━━━━━━━━━━━━━━\n✅ ID & Server ပို့ပြီး မှာယူနိုင်ပါပြီ။";
      navigator.clipboard.writeText(text);
      showToast("Price List ကို Copy ကူးပြီးပါပြီ!");
    }

    function copyVoucher() {
      const activePkgs = packages.filter(p => p.qty > 0);
      if (activePkgs.length === 0) {
        showToast("Package အရင်ရွေးချယ်ပေးပါ!");
        return;
      }

      let totalMMK = 0;
      let text = "🧾 MLBB Order Summary\n━━━━━━━━━━━━━━━━━━\n";
      activePkgs.forEach(pkg => {
        const price = calculateMMK(pkg.coins) * pkg.qty;
        totalMMK += price;
        text += `💎 ${pkg.name} x${pkg.qty} = ${price.toLocaleString()} Ks\n`;
      });
      text += `━━━━━━━━━━━━━━━━━━\n💰 စုစုပေါင်းကျသင့်ငွေ: ${totalMMK.toLocaleString()} Ks`;
      navigator.clipboard.writeText(text);
      showToast("ဘောက်ချာကို Copy ကူးပြီးပါပြီ!");
    }

    // Initial render
    renderPackages();
  </script>
</body>
</html>
